[project]
name = "weightroom"
version = "0.1.0"
description = "Self-hosted gym progress dashboard built from Boostcamp history"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.3,<4",
    "cryptography>=50.0.2",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]
